name: Sync badges

# Best-effort sync of HTB / TryHackMe badges into the site.
# Runs every 2 days, and can be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "0 6 */2 * *" # every 2 days at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-badges
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync badges
        env:
          HTB_PROFILE_ID: "019ec665-2ad2-7220-83ad-c9c96e77dff4"
          THM_USERNAME: "thalkebhaven"
        run: node scripts/sync-badges.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/badges.synced.js assets/img/badges
          if git diff --cached --quiet; then
            echo "No badge changes — nothing to commit."
          else
            git commit -m "chore: auto-sync badges [skip ci]"
            git push
          fi
